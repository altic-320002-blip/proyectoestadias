[build]
  publish = "."
  command = "echo 'Frontend estático listo'"

[dev]
  command = "npx serve ."
  port = 8888

[functions]
  directory = "netlify/functions"

[context.production]
  environment = { SUPABASE_URL = "", SUPABASE_SERVICE_ROLE_KEY = "" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
